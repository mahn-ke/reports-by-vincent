{{define "title"}}Workout{{end}}
{{define "content"}}
<h2 class="mb-3">Workout – Exercise Volume</h2>
<div class="mb-2 d-flex flex-wrap gap-3 align-items-center">
  <div class="btn-group btn-group-sm" role="group" aria-label="Chart mode">
    <input type="radio" class="btn-check" name="chart-mode" id="mode-volume" autocomplete="off" checked />
    <label class="btn btn-outline-secondary" for="mode-volume">Total Volume</label>
    <input type="radio" class="btn-check" name="chart-mode" id="mode-max" autocomplete="off" />
    <label class="btn btn-outline-secondary" for="mode-max">Highest Weight</label>
  </div>
  <div class="btn-group btn-group-sm" role="group" aria-label="Grouping mode">
    <input type="radio" class="btn-check" name="group-mode" id="group-recents" autocomplete="off" checked />
    <label class="btn btn-outline-secondary" for="group-recents">Most recents</label>
    <input type="radio" class="btn-check" name="group-mode" id="group-muscle" autocomplete="off" />
    <label class="btn btn-outline-secondary" for="group-muscle">Muscle groups</label>
  </div>
  <label>
    <input type="checkbox" id="absolute-dates-toggle" class="form-check-input me-1" />
    Shared date range
  </label>
  <label>
    <input type="checkbox" id="linear-dates-toggle" class="form-check-input me-1" checked />
    Linear X axis
  </label>
  <label>
    <input type="checkbox" id="show-hidden-toggle" class="form-check-input me-1" checked />
    Hide hidden exercises
  </label>
  <label>
    <input type="checkbox" id="overview-stacked-toggle" class="form-check-input me-1" />
    Stacked overview
  </label>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h6 class="card-subtitle text-body-secondary mb-2" id="overview-card-title">Selected exercises overlay</h6>
    <div style="position:relative;height:clamp(280px,45vh,520px);">
      <canvas id="overview-canvas" style="width:100%;height:100%;"></canvas>
    </div>
  </div>
</div>
<div id="charts"></div>
<div id="toast-host" style="position:fixed;top:1rem;right:1rem;z-index:1080;display:flex;flex-direction:column;gap:0.5rem;"></div>
{{end}}
{{define "scripts"}}
<script>
// Data injected from Go
const EXERCISE_DAILY_TOTALS = {{.ExerciseDailyTotals}};
const EXERCISE_DAILY_MAX    = {{.ExerciseDailyMax}};
const EXERCISE_NAMES        = {{.ExerciseNames}};
const WEIGHT_POINTS_RAW     = {{.WeightPoints}};

function activeData() {
  return document.getElementById('mode-max').checked ? EXERCISE_DAILY_MAX : EXERCISE_DAILY_TOTALS;
}
function yLabel() {
  return document.getElementById('mode-max').checked ? 'Highest weight (kg)' : 'Total volume (kg)';
}
function groupingMode() {
  return document.getElementById('group-recents').checked ? 'recents' : 'muscle';
}

// Pre-process weight points with timestamps for interpolation
const weightPoints = WEIGHT_POINTS_RAW.map(p => ({
  date: p.date,
  weight: p.weight,
  ts: new Date(p.date + 'T12:00:00').getTime(),
}));

function interpolateWeight(dateStr) {
  if (weightPoints.length === 0) return null;
  const ts = new Date(dateStr + 'T12:00:00').getTime();
  let before = null, after = null;
  for (const p of weightPoints) {
    if (p.ts <= ts) before = p;
    else if (!after) after = p;
  }
  if (before && after) {
    const t = (ts - before.ts) / (after.ts - before.ts);
    return before.weight + t * (after.weight - before.weight);
  }
  if (before) {
    const pts = weightPoints.filter(p => p.ts <= ts);
    if (pts.length >= 2) {
      const [p1, p2] = [pts[pts.length - 2], pts[pts.length - 1]];
      const dt = p2.ts - p1.ts;
      if (dt > 0) return p2.weight + ((p2.weight - p1.weight) / dt) * (ts - p2.ts);
    }
    return before.weight;
  }
  if (after) {
    const pts = weightPoints.filter(p => p.ts >= ts);
    if (pts.length >= 2) {
      const [p1, p2] = [pts[0], pts[1]];
      const dt = p2.ts - p1.ts;
      if (dt > 0) return p1.weight + ((p2.weight - p1.weight) / dt) * (ts - p1.ts);
    }
    return after.weight;
  }
  return null;
}

const COLORS = [
  '#4f46e5','#ef4444','#22c55e','#06b6d4','#8b5cf6',
  '#f97316','#0ea5e9','#ec4899','#10b981','#6366f1'
];

function buildTrendLine(values) {
  const points = [];
  for (let i = 0; i < values.length; i++) {
    const y = values[i];
    if (y != null) points.push({ x: i, y });
  }
  if (points.length < 2) return null;

  // Olympic-style trimming: drop one highest and one lowest point before fitting.
  let fitPoints = points;
  if (points.length > 2) {
    let minIdx = 0;
    let maxIdx = 0;
    for (let i = 1; i < points.length; i++) {
      if (points[i].y < points[minIdx].y) minIdx = i;
      if (points[i].y > points[maxIdx].y) maxIdx = i;
    }
    if (minIdx !== maxIdx) {
      fitPoints = points.filter((_, i) => i !== minIdx && i !== maxIdx);
    }
  }
  if (fitPoints.length < 2) return null;

  let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
  for (const p of fitPoints) {
    sumX += p.x;
    sumY += p.y;
    sumXY += p.x * p.y;
    sumXX += p.x * p.x;
  }

  const n = fitPoints.length;
  const denom = n * sumXX - sumX * sumX;
  if (denom === 0) return null;
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;

  const firstX = points[0].x;
  const lastX = points[points.length - 1].x;
  return values.map((_, i) => {
    if (i < firstX || i > lastX) return null;
    return slope * i + intercept;
  });
}

function firstNonNull(values) {
  for (const v of values) {
    if (v != null) return v;
  }
  return null;
}

function lastNonNull(values) {
  for (let i = values.length - 1; i >= 0; i--) {
    const v = values[i];
    if (v != null) return v;
  }
  return null;
}

function buildGroupRelativeTrend(sectionExerciseIds, labels, dataByExercise) {
  if (!sectionExerciseIds || sectionExerciseIds.length === 0 || labels.length === 0) return null;

  const relSums = new Array(labels.length).fill(0);
  const relCounts = new Array(labels.length).fill(0);

  for (const id of sectionExerciseIds) {
    const valueByDate = dataByExercise[id] || {};
    const values = labels.map(d => (d in valueByDate ? valueByDate[d] : null));
    const baseline = firstNonNull(values);
    if (baseline == null || baseline === 0) continue;

    for (let i = 0; i < values.length; i++) {
      const v = values[i];
      if (v == null) continue;
      relSums[i] += v / baseline;
      relCounts[i] += 1;
    }
  }

  const avgRelative = relSums.map((sum, i) => (relCounts[i] > 0 ? sum / relCounts[i] : null));
  return avgRelative.some(v => v != null) ? avgRelative : null;
}

function buildSectionLabels(sectionExerciseIds, dataByExercise, useLinearDates, absoluteLabels) {
  if (absoluteLabels) return absoluteLabels;

  let minDate = null;
  let maxDate = null;
  const uniqueDates = new Set();
  for (const id of sectionExerciseIds) {
    const byDate = dataByExercise[id] || {};
    for (const d of Object.keys(byDate)) {
      uniqueDates.add(d);
      if (!minDate || d < minDate) minDate = d;
      if (!maxDate || d > maxDate) maxDate = d;
    }
  }

  if (useLinearDates && minDate && maxDate) {
    return buildDateRange(minDate, maxDate);
  }
  return [...uniqueDates].sort();
}

function renderSectionBackgroundTrend(section, sectionExerciseIds, useLinearDates, absoluteLabels) {
  const labels = buildSectionLabels(sectionExerciseIds, activeData(), useLinearDates, absoluteLabels);
  const relative = labels.length >= 2 ? buildGroupRelativeTrend(sectionExerciseIds, labels, activeData()) : null;

  section.style.position = 'relative';
  section.style.overflow = 'hidden';

  const bgCanvas = document.createElement('canvas');
  bgCanvas.className = 'section-trend-bg';
  bgCanvas.style.position = 'absolute';
  const borderLeft = parseFloat(getComputedStyle(section).borderLeftWidth || '0') || 0;
  const borderTop = parseFloat(getComputedStyle(section).borderTopWidth || '0') || 0;
  bgCanvas.style.left = `-${borderLeft}px`;
  bgCanvas.style.top = `-${borderTop}px`;
  bgCanvas.style.width = `calc(100% + ${borderLeft * 2}px)`;
  bgCanvas.style.height = `calc(100% + ${borderTop * 2}px)`;
  bgCanvas.style.pointerEvents = 'none';
  bgCanvas.style.zIndex = '0';
  section.prepend(bgCanvas);

  const header = section.querySelector(':scope > h5');
  const grid = section.querySelector(':scope > .row');
  if (header) {
    header.style.position = 'relative';
    header.style.zIndex = '1';
  }
  if (grid) {
    grid.style.position = 'relative';
    grid.style.zIndex = '1';
  }

  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(1, section.offsetWidth);
  const height = Math.max(1, section.offsetHeight);
  bgCanvas.width = Math.floor(width * dpr);
  bgCanvas.height = Math.floor(height * dpr);

  const ctx = bgCanvas.getContext('2d');
  if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  // Always draw a full-width group trend baseline from x=0 to x=100%.
  // Start is fixed at vertical center; end vertical position reflects relative improvement.
  let improvement = 0;
  if (relative && relative.length > 0) {
    const valid = relative.filter(v => v != null);
    if (valid.length >= 2) {
      const first = valid[0];
      const last = valid[valid.length - 1];
      improvement = last - first;
    }
  }

  const yMid = height * 0.5;
  const yInfluence = Math.max(-1, Math.min(1, improvement)) * (height * 0.42);
  const yEnd = yMid - yInfluence;
  const isUp = improvement >= 0;

  ctx.beginPath();
  ctx.moveTo(0, yMid);
  ctx.lineTo(width, yEnd);

  ctx.strokeStyle = isUp ? 'rgba(34,197,94,0.78)' : 'rgba(249,115,22,0.78)';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([8, 6]);
  ctx.stroke();
}

const MUSCLE_GROUPS = ['Chest','Back','Quads','Hamstrings','Delts','Biceps','Triceps','Other'];

function getMuscleGroup(name) {
  const n = name.toLowerCase();
  if (/hamstring|leg\s*curl|lying\s*curl|seated\s*curl|\brdl\b|romanian|stiff[\s-]?leg|nordic|good\s*morning/.test(n)) return 'Hamstrings';
  if (/\bsquat|leg\s*press|leg\s*ext|\bquad|\blunge|hack\s*squat|split\s*squat|front\s*squat/.test(n)) return 'Quads';
  if (/\bbicep|hammer\s*curl|\bcurl\b|preacher|chin[\s-]?up/.test(n)) return 'Biceps';
  if (/\bchest|bench\s*press|\bbench\b|\bpec\b|fl[yi]e?s?|push[\s-]?up|cable\s*cross|incline\s*press|decline\s*press/.test(n)) return 'Chest';
  if (/\brow\b|\brows\b|pull[\s-]?down|lat\s*pull|\blats?\b|deadlift|\bback\b|pull[\s-]?up|face\s*pull|\bshrug|t[\s-]?bar/.test(n)) return 'Back';
  if (/shoulder|lateral\s*raise|front\s*raise|\bdelt|military|overhead\s*press|\bohp\b|arnold|upright\s*row/.test(n)) return 'Delts';
  if (/tricep|pushdown|skull|close[\s-]?grip|overhead.*ext|\bdip/.test(n)) return 'Triceps';
  return 'Other';
}

// Keys are strings from JSON
let allExerciseIds = Object.keys(EXERCISE_DAILY_TOTALS);

let overviewChart = null;
let selectedExerciseIds = new Set();
let exerciseCharts = [];
const HIDDEN_EXERCISES_KEY = 'workout-hidden-exercise-ids';
let hideToastCounter = 0;

function showHideToast(message) {
  const host = document.getElementById('toast-host');
  if (!host) return;

  const toastId = `hide-toast-${++hideToastCounter}`;
  const toast = document.createElement('div');
  toast.id = toastId;
  toast.setAttribute('role', 'status');
  toast.style.position = 'relative';
  toast.style.minWidth = '260px';
  toast.style.maxWidth = '360px';
  toast.style.padding = '0.85rem 2rem 0.75rem 0.85rem';
  toast.style.border = '1px solid rgba(255,255,255,0.18)';
  toast.style.borderRadius = '0.5rem';
  toast.style.background = 'rgba(32,34,45,0.95)';
  toast.style.color = '#e9ecef';
  toast.style.boxShadow = '0 8px 24px rgba(0,0,0,0.35)';
  toast.style.overflow = 'hidden';

  const progress = document.createElement('div');
  progress.style.position = 'absolute';
  progress.style.top = '0';
  progress.style.left = '0';
  progress.style.height = '3px';
  progress.style.width = '100%';
  progress.style.background = '#22c55e';
  progress.style.transformOrigin = 'left center';
  progress.style.animation = 'toast-shrink 5s linear forwards';

  const text = document.createElement('div');
  text.textContent = message;

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.textContent = '×';
  closeBtn.setAttribute('aria-label', 'Close notification');
  closeBtn.style.position = 'absolute';
  closeBtn.style.top = '0.35rem';
  closeBtn.style.right = '0.45rem';
  closeBtn.style.border = 'none';
  closeBtn.style.background = 'transparent';
  closeBtn.style.color = '#d6d8db';
  closeBtn.style.fontSize = '1.1rem';
  closeBtn.style.lineHeight = '1';
  closeBtn.style.cursor = 'pointer';

  let timerId = null;
  const closeToast = () => {
    if (timerId) clearTimeout(timerId);
    toast.remove();
  };
  closeBtn.addEventListener('click', closeToast);

  toast.appendChild(progress);
  toast.appendChild(text);
  toast.appendChild(closeBtn);
  host.appendChild(toast);
  timerId = setTimeout(closeToast, 5000);
}

function ensureToastAnimationStyle() {
  if (document.getElementById('toast-shrink-style')) return;
  const style = document.createElement('style');
  style.id = 'toast-shrink-style';
  style.textContent = '@keyframes toast-shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}';
  document.head.appendChild(style);
}

function rerenderPreservingScroll(useAbsoluteDates) {
  const scrollY = window.scrollY;
  renderAll(useAbsoluteDates);
  requestAnimationFrame(() => window.scrollTo(0, scrollY));
}

function loadHiddenExerciseIds() {
  try {
    const raw = localStorage.getItem(HIDDEN_EXERCISES_KEY);
    if (!raw) return new Set();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return new Set();
    return new Set(parsed.map(v => String(v)));
  } catch {
    return new Set();
  }
}

function saveHiddenExerciseIds() {
  localStorage.setItem(HIDDEN_EXERCISES_KEY, JSON.stringify([...hiddenExerciseIds]));
}

function showHiddenExercises() {
  return document.getElementById('show-hidden-toggle')?.checked !== true;
}

let hiddenExerciseIds = loadHiddenExerciseIds();

function syncSelectionHighlights() {
  document.querySelectorAll('.chart-card').forEach(card => {
    card.classList.toggle('border-primary', selectedExerciseIds.has(card.dataset.exerciseId));
  });
}

// ── date helpers ──

function findGlobalDateBounds(ids) {
  const data = activeData();
  let minDate = null, maxDate = null;
  for (const id of ids) {
    for (const date of Object.keys(data[id] || {})) {
      if (!minDate || date < minDate) minDate = date;
      if (!maxDate || date > maxDate) maxDate = date;
    }
  }
  return { minDate, maxDate };
}

function buildDateRange(startDate, endDate) {
  if (!startDate || !endDate) return [];
  const labels = [];
  const cursor = new Date(startDate + 'T00:00:00');
  const last   = new Date(endDate   + 'T00:00:00');
  while (cursor <= last) {
    labels.push(cursor.toISOString().slice(0, 10));
    cursor.setDate(cursor.getDate() + 1);
  }
  return labels;
}

// ── overview chart ──

async function renderOverviewChart() {
  const title = document.querySelector('#overview-card-title');
  const canvas = document.getElementById('overview-canvas');
  const stackedMode = document.getElementById('overview-stacked-toggle').checked;
  const selectedIds = [...selectedExerciseIds].filter(id => showHiddenExercises() || !hiddenExerciseIds.has(String(id)));
  const data = activeData();

  if (selectedIds.length === 0) {
    title.textContent = 'Selected exercises overlay (select a chart below)';
    if (overviewChart) {
      overviewChart.data.labels = [];
      overviewChart.data.datasets = [];
      overviewChart.update('none');
    } else {
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }
    return;
  }

  const { minDate, maxDate } = (() => {
    let mn = null, mx = null;
    for (const id of selectedIds) {
      for (const d of Object.keys(data[id] || {})) {
        if (!mn || d < mn) mn = d;
        if (!mx || d > mx) mx = d;
      }
    }
    return { minDate: mn, maxDate: mx };
  })();
  const labels = buildDateRange(minDate, maxDate);
  const datasets = [];

  for (let i = 0; i < selectedIds.length; i++) {
    const id = selectedIds[i];
    const dailyTotals = EXERCISE_DAILY_TOTALS[id];
    if (!dailyTotals) continue;
    const name = EXERCISE_NAMES[id] || `Exercise ${id}`;
    const color = COLORS[i % COLORS.length];
    datasets.push({
      label: name,
      data: labels.map(d => (d in data[id] ? data[id][d] : null)),
      borderColor: color,
      backgroundColor: color + '66',
      stack: stackedMode ? 'sel' : undefined,
      borderWidth: 1, borderRadius: 2, borderSkipped: false,
    });
  }

  title.textContent = `Selected exercises ${stackedMode ? 'stacked' : 'overlay'} (${datasets.length})`;
  const options = {
    responsive: true,
    animation: false,
    resizeDelay: 180,
    normalized: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false, axis: 'x' },
    plugins: {
      legend: { labels: { color: '#aaa' } },
      tooltip: {
        mode: 'index', intersect: false,
        filter: item => item.parsed.y != null,
        callbacks: { label: ctx => ctx.parsed.y == null ? null : `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} kg` }
      }
    },
    scales: {
      x: { ticks: { color: '#777', maxTicksLimit: 16 }, grid: { color: '#2a2a36' }, stacked: stackedMode },
      y: { ticks: { color: '#777', callback: v => `${v} kg` }, grid: { color: '#2a2a36' }, stacked: stackedMode, beginAtZero: true }
    }
  };

  if (!overviewChart) {
    overviewChart = new Chart(canvas, {
      type: 'bar',
      data: { labels, datasets },
      options,
    });
    return;
  }

  overviewChart.data.labels = labels;
  overviewChart.data.datasets = datasets;
  overviewChart.options = options;
  overviewChart.update('none');
}

// ── per-exercise chart ──

function renderExerciseChart(id, name, colorIndex, absoluteLabels, useLinearDates, container) {
  const dailyTotals = activeData()[id] || {};
  const sortedDates = Object.keys(dailyTotals).sort();
  const valueByDate = Object.fromEntries(sortedDates.map(d => [d, dailyTotals[d]]));
  let labels = absoluteLabels || sortedDates;
  if (!absoluteLabels && useLinearDates && sortedDates.length > 1) {
    labels = buildDateRange(sortedDates[0], sortedDates[sortedDates.length - 1]);
  }
  const seriesData = labels.map(d => (d in valueByDate ? valueByDate[d] : null));
  const color  = COLORS[colorIndex % COLORS.length];

  // Body weight interpolated for each label date
  const bodyWeightValues = labels.map(d => interpolateWeight(d));
  const hasWeight = bodyWeightValues.some(v => v !== null);

  const card = document.createElement('div');
  const sid = String(id);
  const isHidden = hiddenExerciseIds.has(sid);
  card.className = 'card chart-card position-relative' + (selectedExerciseIds.has(sid) ? ' border-primary' : '');
  card.dataset.exerciseId = String(id);
  card.style.cursor = 'pointer';
  card.style.opacity = '1.0';
  card.style.backgroundColor = 'rgba(33, 37, 45, 0.74)';
  if (isHidden) {
    card.style.backgroundColor = 'rgba(220, 53, 69, 0.08)';
    card.style.borderColor = 'rgba(220, 53, 69, 0.45)';
  }

  const body = document.createElement('div');
  body.className = 'card-body d-flex flex-column';
  body.style.height = '300px';

  const h = document.createElement('h6');
  h.className = 'card-subtitle text-body-secondary mb-2';
  h.textContent = name;
  body.appendChild(h);

  const hideBtn = document.createElement('button');
  hideBtn.type = 'button';
  hideBtn.className = 'btn btn-sm btn-outline-danger position-absolute top-0 end-0 m-2 py-0 px-2';
  hideBtn.textContent = '×';
  hideBtn.title = isHidden ? 'unhide' : 'hide';
  hideBtn.setAttribute('aria-label', isHidden ? 'Unhide exercise' : 'Hide exercise');
  hideBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const wasHidden = hiddenExerciseIds.has(sid);
    if (hiddenExerciseIds.has(sid)) {
      hiddenExerciseIds.delete(sid);
    } else {
      hiddenExerciseIds.add(sid);
      selectedExerciseIds.delete(sid);
    }
    saveHiddenExerciseIds();
    const useAbsoluteDates = document.getElementById('absolute-dates-toggle')?.checked === true;
    rerenderPreservingScroll(useAbsoluteDates);
    showHideToast(wasHidden ? `Unhid exercise: ${name}` : `Hid exercise: ${name}`);
  });
  card.appendChild(hideBtn);

  const canvas = document.createElement('canvas');
  canvas.style.flex = '1';
  body.appendChild(canvas);
  card.appendChild(body);
  container.appendChild(card);

  const datasets = [];
  if (hasWeight) {
    datasets.push({
      type: 'bar',
      label: 'Body weight (kg)',
      data: bodyWeightValues,
      yAxisID: 'y-weight',
      backgroundColor: 'rgba(255,200,80,0.13)',
      borderColor: 'rgba(255,200,80,0.35)',
      borderWidth: 1,
      order: 0,
    });
  }
  datasets.push({
    type: 'line',
    label: yLabel(),
    data: seriesData,
    yAxisID: 'y',
    borderColor: color,
    borderWidth: 2,
    pointRadius: 3,
    tension: 0.3,
    fill: false,
    spanGaps: !!absoluteLabels || useLinearDates,
    order: 1,
  });

  const trend = buildTrendLine(seriesData);
  if (trend) {
    const trendStart = firstNonNull(trend);
    const trendEnd = lastNonNull(trend);
    const isUp = trendStart != null && trendEnd != null ? trendEnd >= trendStart : true;
    datasets.push({
      type: 'line',
      label: `${yLabel()} trend`,
      data: trend,
      yAxisID: 'y',
      borderColor: isUp ? 'rgba(34,197,94,0.92)' : 'rgba(249,115,22,0.92)',
      borderWidth: 2,
      borderDash: [6, 4],
      pointRadius: 0,
      tension: 0,
      fill: false,
      spanGaps: true,
      order: 2,
    });
  }

  const scales = {
    x: { ticks: { color: '#777', maxTicksLimit: 10 }, grid: { color: 'rgba(255,255,255,0.05)' } },
    y: {
      position: 'left',
      ticks: { color: '#777', callback: v => `${v} kg` },
      grid: { color: 'rgba(255,255,255,0.05)' },
      beginAtZero: true,
    },
  };
  if (hasWeight) {
    const nonNull = bodyWeightValues.filter(v => v !== null);
    const minW = Math.min(...nonNull), maxW = Math.max(...nonNull);
    const pad = Math.max((maxW - minW) * 0.5, 2);
    scales['y-weight'] = {
      position: 'right',
      ticks: { color: 'rgba(255,200,80,0.55)', callback: v => v.toFixed(1) },
      grid: { drawOnChartArea: false },
      min: Math.floor(minW - pad),
      max: Math.ceil(maxW + pad),
    };
  }

  const chart = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    plugins: [],
    options: {
      responsive: true,
      animation: false,
      resizeDelay: 180,
      normalized: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.dataset.yAxisID === 'y-weight') return ` Body weight: ${ctx.parsed.y.toFixed(1)} kg`;
              if (ctx.dataset.label.endsWith(' trend')) return ` Trend: ${ctx.parsed.y.toFixed(1)} kg`;
              return ` ${ctx.parsed.y.toFixed(1)} kg`;
            }
          }
        }
      },
      scales,
    }
  });
  exerciseCharts.push(chart);

  card.addEventListener('click', async () => {
    const sid = String(id);
    if (selectedExerciseIds.has(sid)) {
      selectedExerciseIds.delete(sid);
    } else {
      selectedExerciseIds.add(sid);
    }
    syncSelectionHighlights();
    await renderOverviewChart();
  });
}

// ── main render ──

function renderAll(useAbsoluteDates) {
  for (const c of exerciseCharts) {
    c.destroy();
  }
  exerciseCharts = [];

  const chartsEl = document.getElementById('charts');
  chartsEl.innerHTML = '';
  allExerciseIds = Object.keys(activeData());
  const colorByExerciseId = Object.fromEntries(allExerciseIds.map((id, idx) => [id, idx]));
  const useLinearDates = document.getElementById('linear-dates-toggle').checked;
  const showHidden = showHiddenExercises();

  const { minDate, maxDate } = findGlobalDateBounds(allExerciseIds);
  const absoluteLabels = useAbsoluteDates ? buildDateRange(minDate, maxDate) : null;

  if (groupingMode() === 'muscle') {
    // classify exercises into muscle groups
    const grouped = {};
    for (const id of allExerciseIds) {
      const name  = EXERCISE_NAMES[id] || `Exercise ${id}`;
      const group = getMuscleGroup(name);
      (grouped[group] = grouped[group] || []).push({ id, name });
    }

    for (const group of MUSCLE_GROUPS) {
      const list = grouped[group];
      if (!list || list.length === 0) continue;

      const visibleList = list.filter(({ id }) => {
        const dailyTotals = activeData()[id];
        if (!dailyTotals || Object.keys(dailyTotals).length === 0) return false;
        if (hiddenExerciseIds.has(String(id)) && !showHidden) return false;
        return true;
      });
      if (visibleList.length === 0) continue;

      const sectionExerciseIds = visibleList.map(({ id }) => String(id));

      const section = document.createElement('div');
      section.className = 'mb-4 p-3 rounded border';
      section.style.backgroundColor = 'rgba(255,255,255,0.015)';
      section.style.borderColor = 'rgba(255,255,255,0.08)';

      const header = document.createElement('h5');
      header.className = 'text-uppercase text-body-secondary border-bottom pb-1 mb-3';
      header.style.fontSize = '0.75rem';
      header.style.letterSpacing = '0.1em';
      header.textContent = group;
      section.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'row g-3';
      section.appendChild(grid);
      chartsEl.appendChild(section);

      for (const { id, name } of visibleList) {
        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-xl-3';
        grid.appendChild(col);
        renderExerciseChart(id, name, colorByExerciseId[id], absoluteLabels, useLinearDates, col);
      }

      renderSectionBackgroundTrend(section, sectionExerciseIds, useLinearDates, absoluteLabels);
    }
  } else {
    // group by workout date (newest first); an exercise can appear in multiple date groups
    const groupedByDate = {};
    for (const id of allExerciseIds) {
      const name = EXERCISE_NAMES[id] || `Exercise ${id}`;
      const dates = Object.keys(activeData()[id] || {}).sort().reverse();
      for (const d of dates) {
        (groupedByDate[d] = groupedByDate[d] || []).push({ id, name });
      }
    }

    const datesDesc = Object.keys(groupedByDate).sort().reverse();
    for (const date of datesDesc) {
      const list = groupedByDate[date];
      if (!list || list.length === 0) continue;

      const visibleList = list.filter(({ id }) => !(hiddenExerciseIds.has(String(id)) && !showHidden));
      if (visibleList.length === 0) continue;

      const sectionExerciseIds = visibleList.map(({ id }) => String(id));

      const section = document.createElement('div');
      section.className = 'mb-4 p-3 rounded border';
      section.style.backgroundColor = 'rgba(255,255,255,0.015)';
      section.style.borderColor = 'rgba(255,255,255,0.08)';

      const header = document.createElement('h5');
      header.className = 'text-uppercase text-body-secondary border-bottom pb-1 mb-3';
      header.style.fontSize = '0.75rem';
      header.style.letterSpacing = '0.1em';
      header.textContent = `${date} (${visibleList.length})`;
      section.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'row g-3';
      section.appendChild(grid);
      chartsEl.appendChild(section);

      for (const { id, name } of visibleList) {
        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-xl-3';
        grid.appendChild(col);
        renderExerciseChart(id, name, colorByExerciseId[id], absoluteLabels, useLinearDates, col);
      }

      renderSectionBackgroundTrend(section, sectionExerciseIds, useLinearDates, absoluteLabels);
    }
  }

  syncSelectionHighlights();
  renderOverviewChart();
}

// ── init ──

if (Object.keys(EXERCISE_DAILY_TOTALS).length === 0) {
  document.getElementById('charts').innerHTML =
    '<p class="text-body-secondary">No workout data yet — the wger sync job will populate this.</p>';
} else {
  ensureToastAnimationStyle();
  const absToggle     = document.getElementById('absolute-dates-toggle');
  const linearToggle  = document.getElementById('linear-dates-toggle');
  const showHiddenToggle = document.getElementById('show-hidden-toggle');
  const stackedToggle = document.getElementById('overview-stacked-toggle');
  const modeInputs    = document.querySelectorAll('input[name="chart-mode"]');
  const groupInputs   = document.querySelectorAll('input[name="group-mode"]');

  absToggle.addEventListener('change', () => renderAll(absToggle.checked));
  linearToggle.addEventListener('change', () => renderAll(absToggle.checked));
  showHiddenToggle.addEventListener('change', () => renderAll(absToggle.checked));
  stackedToggle.addEventListener('change', () => renderOverviewChart());
  modeInputs.forEach(r => r.addEventListener('change', () => renderAll(absToggle.checked)));
  groupInputs.forEach(r => r.addEventListener('change', () => renderAll(absToggle.checked)));

  renderAll(false);
}
</script>
