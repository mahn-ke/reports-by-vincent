{{define "title"}}Login{{end}}
{{define "content"}}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center">Sign in to Reports</h4>

        {{if .Error}}
        <div class="alert alert-danger py-2">{{.Error}}</div>
        {{end}}

        {{if .OIDCEnabled}}
        <a class="btn btn-primary w-100" href="/oauth/login">
          Continue with {{.ProviderName}}
        </a>
        <p class="text-body-secondary small text-center mt-3 mb-0">Admin accounts only.</p>
        {{else}}
        <div class="alert alert-warning py-2 mb-0">Single sign-on is not configured.</div>
        {{end}}
      </div>
    </div>
  </div>
</div>
{{end}}
