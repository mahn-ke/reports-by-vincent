{{define "title"}}Login{{end}}
{{define "content"}}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center">Sign in to Reports</h4>

        {{if .Error}}
        <div class="alert alert-danger py-2">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/login">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="text" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>

        {{if .OIDCEnabled}}
        <hr class="my-4">
        <a class="btn btn-outline-secondary w-100" href="/oauth/login">
          Continue with {{.ProviderName}}
        </a>
        {{end}}
      </div>
    </div>
  </div>
</div>
{{end}}
